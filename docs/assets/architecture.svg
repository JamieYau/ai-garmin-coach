<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">AI Garmin Coach MVP architecture</title>
  <desc id="desc">A Next.js frontend sends authenticated requests to a FastAPI API. The API stores normalized Garmin data and coach insights in PostgreSQL. Scheduled jobs sync Garmin data and generate daily insights.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 30px system-ui, sans-serif; }
      .subtitle { fill: #475569; font: 400 16px system-ui, sans-serif; }
      .label { fill: #0f172a; font: 700 18px system-ui, sans-serif; }
      .body { fill: #475569; font: 400 14px system-ui, sans-serif; }
      .tag { fill: #334155; font: 600 12px system-ui, sans-serif; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="670" rx="24"/>
  <text class="title" x="60" y="70">AI Garmin Coach — MVP architecture</text>
  <text class="subtitle" x="60" y="102">A small, typed pipeline from Garmin data to a structured coaching dashboard.</text>

  <g transform="translate(60 165)">
    <rect width="250" height="180" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <text class="label" x="26" y="42">Next.js frontend</text>
    <text class="body" x="26" y="75">• Better Auth sessions</text>
    <text class="body" x="26" y="102">• Dashboard and source UI</text>
    <text class="body" x="26" y="129">• TanStack Query data client</text>
    <rect x="26" y="145" width="104" height="24" rx="12" fill="#c7d2fe"/>
    <text class="tag" x="43" y="162">Browser</text>
  </g>

  <g transform="translate(475 165)">
    <rect width="250" height="180" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
    <text class="label" x="26" y="42">FastAPI backend</text>
    <text class="body" x="26" y="75">• Cookie session boundary</text>
    <text class="body" x="26" y="102">• Garmin normalization</text>
    <text class="body" x="26" y="129">• Deterministic safety + AI</text>
    <rect x="26" y="145" width="92" height="24" rx="12" fill="#bbf7d0"/>
    <text class="tag" x="46" y="162">REST API</text>
  </g>

  <g transform="translate(890 165)">
    <rect width="250" height="180" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text class="label" x="26" y="42">PostgreSQL</text>
    <text class="body" x="26" y="75">• Auth and app profiles</text>
    <text class="body" x="26" y="102">• Activities, sleep, metrics</text>
    <text class="body" x="26" y="129">• Insights and sync metadata</text>
    <rect x="26" y="145" width="112" height="24" rx="12" fill="#fed7aa"/>
    <text class="tag" x="42" y="162">Private data</text>
  </g>

  <path class="arrow" d="M310 255 H475"/>
  <text class="tag" x="350" y="238">authenticated API calls</text>
  <path class="arrow" d="M725 255 H890"/>
  <text class="tag" x="770" y="238">SQLAlchemy</text>

  <g transform="translate(155 440)">
    <rect width="250" height="145" rx="16" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <text class="label" x="26" y="42">Garmin connector</text>
    <text class="body" x="26" y="75">Activities, sleep, recovery,</text>
    <text class="body" x="26" y="98">and biometric source payloads.</text>
    <rect x="26" y="110" width="122" height="24" rx="12" fill="#99f6e4"/>
    <text class="tag" x="44" y="127">External source</text>
  </g>

  <g transform="translate(475 440)">
    <rect width="250" height="145" rx="16" fill="#fdf4ff" stroke="#f0abfc" stroke-width="2"/>
    <text class="label" x="26" y="42">Scheduled jobs</text>
    <text class="body" x="26" y="75">Daily sync orchestration and</text>
    <text class="body" x="26" y="98">structured insight generation.</text>
    <rect x="26" y="110" width="120" height="24" rx="12" fill="#f5d0fe"/>
    <text class="tag" x="47" y="127">Container Apps Job</text>
  </g>

  <g transform="translate(795 440)">
    <rect width="250" height="145" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="label" x="26" y="42">AI provider</text>
    <text class="body" x="26" y="75">Strict Pydantic-validated</text>
    <text class="body" x="26" y="98">JSON coaching output only.</text>
    <rect x="26" y="110" width="118" height="24" rx="12" fill="#bfdbfe"/>
    <text class="tag" x="46" y="127">Structured output</text>
  </g>

  <path class="arrow" d="M405 512 H475"/>
  <path class="arrow" d="M600 440 V345"/>
  <path class="arrow" d="M725 512 H795"/>
  <path class="arrow" d="M920 440 V345"/>
  <text class="tag" x="435" y="495">sync</text>
  <text class="tag" x="748" y="495">insight request</text>
</svg>
